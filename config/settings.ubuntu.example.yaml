app:
  name: "Hub"
  version: "0.1.0"
  page_title: "Ubuntu · Hub"

node:
  id: "ubuntu"
  name: "Ubuntu"
  type: "ubuntu"

server:
  # Replace with this node's Tailscale IP to enable remote Codex PTY.
  host: "127.0.0.1"
  port: 8080

security:
  # Allow direct requests from devices in the same tailnet without a Hub Token.
  # This only takes effect when server.host is this node's Tailscale IP.
  allow_tailscale: true

logs:
  file: "logs/hub.log"
  level: "INFO"
  max_lines: 100

codex_pty:
  enabled: true
  workspace: "~/workspace"
  data_file: "data/codex-sessions.json"
  ticket_ttl_seconds: 600
  max_running: 3
  quick_interaction_timeout_seconds: 21600

automations:
  enabled: true
  shared_config_file: "config/automations.yaml"
  local_config_file: "config/automations.local.yaml"
  data_dir: "data/automations"
  max_home_tasks: 3

project_documents:
  state_file: "data/project-documents.json"

llm:
  enabled: true
  config_source: "openclaw"
  openclaw_config_file: "~/.openclaw/openclaw.json"
  # Set provider and model when OpenClaw has more than one candidate.
  provider: null
  model: null
  timeout_seconds: 30
  max_tokens: 512
  max_concurrency: 2
  max_response_bytes: 1048576

notifications:
  enabled: true
  registry_file: "~/.config/chub/notifications/registry.yaml"
  secrets_dir: "~/.config/chub/notifications/secrets"
  timeout_seconds: 5
  max_message_bytes: 4000
  dedup_ttl_seconds: 600
