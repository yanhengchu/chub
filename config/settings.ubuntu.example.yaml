app:
  name: "Hub"
  version: "0.1.0"
  page_title: "Ubuntu · Hub"

node:
  id: "ubuntu"
  name: "Ubuntu"
  type: "ubuntu"

server:
  # Replace with this node's Tailscale IP to enable remote Codex PTY.
  host: "127.0.0.1"
  port: 8080

security:
  # Allow direct requests from devices in the same tailnet without a Hub Token.
  # This only takes effect when server.host is this node's Tailscale IP.
  allow_tailscale: true

logs:
  file: "logs/hub.log"
  level: "INFO"
  max_lines: 100

codex_pty:
  enabled: true
  workspace: "~/workspace"
  data_file: "data/state/codex/sessions.json"
  runtime_dir: "data/runtime/codex"
  ticket_ttl_seconds: 600
  max_running: 3
  quick_interaction_timeout_seconds: 21600

automations:
  enabled: true
  shared_config_file: "config/automations.yaml"
  local_config_file: "config/automations.local.yaml"
  state_dir: "data/state/automations"
  runtime_dir: "data/runtime/automations"
  artifacts_dir: "data/artifacts/automations/downloads"
  max_home_tasks: 3

ai_usage:
  provider: "openai"
  timezone: "Asia/Shanghai"
  provider_api:
    # Configure only in settings.local.yaml after the managed browser is ready.
    subscription_page_url: null
    subscription_id: null
    allow_private_http: false

project_documents:
  state_file: "data/state/project-documents.json"

notifications:
  enabled: true
  registry_file: "~/.config/chub/notifications/registry.yaml"
  secrets_dir: "~/.config/chub/notifications/secrets"
  timeout_seconds: 5
  max_message_bytes: 4000
  dedup_ttl_seconds: 600

openclaw:
  weixin_chub_mode:
    # Explicitly enable only after the single-Owner WeChat private-message route is ready.
    enabled: false
    workspace_id: "chub"
    # Display limits used by WeChat Chub Session lists and the `chub` task list.
    session_name_max_width: 30
    task_name_max_width: 64
    # Initial default for the Settings-page translation switch. Later page changes
    # are persisted in private Chub state without rewriting this file.
    # Opt in only after accepting the model/prompt-injection trust boundary.
    translation_enabled: false
    translation_queue_limit: 10
    translation_max_wait_seconds: 1800
    translation_max_input_chars: 8000
  quick_interaction_completion:
    # Default recipient for Chub/page-origin quick interactions only.
    # Keep weixin_account_id null to select the only healthy ClawBot; set it only as a
    # compatibility override. Weixin inbound tasks use their immutable task route.
    enabled: true
    weixin_account_id: null
    weixin_recipient: null
    timeout_seconds: 20
    # Per-message limit; long results are numbered and sent in at most five parts.
    max_message_chars: 2000
