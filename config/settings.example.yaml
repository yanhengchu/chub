app:
  name: "Hub"
  version: "0.1.0"
  page_title: "My Device · Hub"

node:
  id: "my-device"
  name: "My Device"
  # Set to "macos" or "ubuntu" for this device. The YAML is otherwise shared;
  # service installation chooses LaunchAgent on macOS and systemd user service on Ubuntu.
  type: "unknown"

server:
  # Chub always listens on 127.0.0.1 for local browser and OpenClaw access.
  # Set this node's Tailscale IP to enable remote access and Codex PTY.
  tailnet_host: null
  port: 8080

security:
  # Allow direct requests from devices in the same tailnet.
  # This only takes effect when server.tailnet_host is configured.
  allow_tailscale: true

logs:
  file: "logs/hub.log"
  level: "INFO"
  max_lines: 100

codex_pty:
  enabled: true
  workspace: "~/workspace"
  data_file: "data/local/state/codex/sessions.json"
  runtime_dir: "data/local/runtime/codex"
  ticket_ttl_seconds: 600
  max_running: 3
  quick_interaction_timeout_seconds: 21600

automations:
  enabled: true
  shared_config_file: "config/automations.yaml"
  local_config_file: "config/automations.local.yaml"
  state_dir: "data/local/state/automations"
  runtime_dir: "data/local/runtime/automations"
  artifacts_dir: "data/local/artifacts/automations/downloads"
  max_home_tasks: 3

ai_usage:
  provider: "openai"
  timezone: "Asia/Shanghai"
  provider_api:
    # Configure only in settings.local.yaml after the managed browser is ready.
    subscription_page_url: null
    subscription_id: null
    allow_private_http: false

project_documents:
  state_file: "data/local/state/project-documents.json"

requests:
  state_file: "data/shared/chub/requests.json"

notifications:
  enabled: true
  registry_file: "~/.config/chub/notifications/registry.yaml"
  secrets_dir: "~/.config/chub/notifications/secrets"
  timeout_seconds: 5
  max_message_bytes: 4000
  dedup_ttl_seconds: 600

# Disabled by default. On Ubuntu, set the Wi-Fi device and both UUIDs in
# settings.local.yaml to allow the fixed `chub network-restart` and WeChat
# `restart network` action. macOS does not support this NetworkManager action.
# The action never accepts connection names, UUIDs, commands, or paths from a
# caller, and leaves Tailscale unchanged.
network_recovery:
  enabled: false
  wifi_device: null
  wifi_connection_uuid: null
  vpn_connection_uuid: null
  wifi_timeout_seconds: 45
  vpn_timeout_seconds: 60
  lock_file: "data/local/runtime/network-recovery.lock"

openclaw:
  weixin_chub_mode:
    # Explicitly enable only after the single-Owner WeChat private-message route is ready.
    enabled: false
    workspace_id: "chub"
    session_name_max_width: 30
    task_name_max_width: 64
    # Initial default for the Settings-page text-processing mode.  Existing
    # translation_enabled values map false to direct and true to auto.
    translation_enabled: false
    # translation_mode: "direct" # direct | auto | confirm
    translation_queue_limit: 10
    translation_max_wait_seconds: 1800
    translation_max_input_chars: 8000
    # Submit longer task bodies directly instead of polishing/translating them.
    translation_preprocess_max_input_chars: 1200
  quick_interaction_completion:
    # Completion notifications are sent only for tasks submitted through the
    # Weixin ClawBot route. The following recipient fields are retained for
    # compatibility with older local configuration and are not used for Web tasks.
    enabled: true
    weixin_account_id: null
    weixin_recipient: null
    timeout_seconds: 20
    max_message_chars: 2000
