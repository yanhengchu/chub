<!doctype html>
{% set ui_theme = resolve_ui_theme(request.cookies.get('hub_ui_style')) %}
{% set ui_font_size = resolve_ui_font_size(request.cookies.get('hub_ui_font_size')) %}
<html lang="zh-CN" data-ui-style="{{ ui_theme.id }}" data-ui-theme-default="{{ default_ui_theme }}" data-ui-theme-schemes="{{ ui_theme_schemes }}" data-ui-font-size="{{ ui_font_size.id }}" data-ui-font-size-default="{{ default_ui_font_size }}" data-ui-font-size-scales="{{ ui_font_size_scales }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="color-scheme" content="{{ ui_theme.color_scheme }}">
    <title>快速交互</title>
    {% include "partials/app_styles.html" %}
    <script src="/static/js/components/ui.js" defer></script>
    <script src="/static/quick_interactions_core.js" defer></script>
    <script src="/static/quick_interaction_session.js" defer></script>
    <script src="/static/quick_interaction_timeline.js" defer></script>
    <script src="/static/quick_interaction_conversation.js" defer></script>
  </head>
  <body class="conversation-body{% if request.query_params.get('embedded') == 'workspace' %} conversation-body-embedded{% endif %}" data-session-id="{{ session_id }}">
    <main>
      <section class="conversation-page" aria-label="快速交互">
        <div id="conversation-scroll" class="conversation-scroll">
          <button id="conversation-load-earlier" class="button-secondary conversation-load-earlier" type="button" hidden>加载更早消息</button>
          <p id="conversation-history-message" class="message conversation-history-message" aria-live="polite"></p>
          <div id="conversation-feed" class="conversation-feed" aria-label="快速交互消息"></div>
          <button id="conversation-jump-latest" class="button-secondary conversation-jump-latest" type="button" hidden>回到最新消息</button>
        </div>

        <form id="conversation-form" class="conversation-composer">
          <div id="conversation-session-navigation" class="conversation-session-navigation" hidden>
            <button id="conversation-session-create" class="conversation-session-create" type="button" aria-label="新建 Session" aria-haspopup="dialog" aria-controls="conversation-create-dialog" title="新建 Session" disabled><span aria-hidden="true">+</span></button>
            <nav id="conversation-session-switcher" class="conversation-session-switcher" aria-label="切换 Session"></nav>
          </div>
          <div id="conversation-session-title-row" class="conversation-session-title-row" hidden>
            <p id="conversation-session-title" class="conversation-session-title"></p>
            <button id="conversation-session-rename" class="conversation-session-rename" type="button" aria-label="重命名 Session" aria-haspopup="dialog" aria-controls="conversation-rename-dialog" title="重命名 Session"><span aria-hidden="true">&#9998;</span></button>
            <button id="conversation-session-stop" class="conversation-session-stop" type="button" aria-label="停止 Session" title="停止 Session" disabled>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                <rect width="12" height="12" x="6" y="6" rx="1"></rect>
              </svg>
            </button>
            <button id="conversation-session-archive" class="conversation-session-archive" type="button" aria-label="归档 Session" aria-haspopup="dialog" aria-controls="conversation-archive-dialog" title="归档 Session" disabled>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                <rect width="20" height="5" x="2" y="3" rx="1"></rect>
                <path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8"></path>
                <path d="M10 12h4"></path>
              </svg>
            </button>
            <button id="conversation-session-delete" class="conversation-session-delete" type="button" aria-label="删除 Session" aria-haspopup="dialog" aria-controls="conversation-delete-dialog" title="删除 Session" disabled>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                <path d="M4 7h16"></path>
                <path d="M10 11v6"></path>
                <path d="M14 11v6"></path>
                <path d="m6 7 1 13h10l1-13"></path>
                <path d="M9 7V4h6v3"></path>
              </svg>
            </button>
          </div>
          <div class="conversation-input-row">
            <textarea id="conversation-prompt" rows="1" maxlength="8000" required placeholder="输入消息…" aria-label="快速交互需求" disabled></textarea>
            <div class="conversation-composer-toolbar">
              <div id="conversation-composer-options" class="conversation-composer-options" role="group" aria-label="当前 Session 配置">
                <div class="conversation-composer-option" data-composer-option="permission">
                  <button id="conversation-permission-trigger" class="conversation-composer-control conversation-setting-trigger" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="conversation-permission-menu" disabled>
                    <span id="conversation-permission-value" class="conversation-setting-value">正在读取…</span>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                      <path d="m7 10 5 5 5-5"></path>
                    </svg>
                  </button>
                  <div id="conversation-permission-menu" class="conversation-setting-menu" role="listbox" aria-label="权限" hidden></div>
                </div>
                <div class="conversation-composer-option" data-composer-option="model">
                  <button id="conversation-model-trigger" class="conversation-composer-control conversation-setting-trigger" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="conversation-model-menu" disabled>
                    <span id="conversation-model-value" class="conversation-setting-value">正在读取…</span>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                      <path d="m7 10 5 5 5-5"></path>
                    </svg>
                  </button>
                  <div id="conversation-model-menu" class="conversation-setting-menu" role="listbox" aria-label="模型" hidden></div>
                </div>
                <div class="conversation-composer-option" data-composer-option="reasoning">
                  <button id="conversation-reasoning-trigger" class="conversation-composer-control conversation-setting-trigger" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="conversation-reasoning-menu" disabled>
                    <span id="conversation-reasoning-value" class="conversation-setting-value">正在读取…</span>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                      <path d="m7 10 5 5 5-5"></path>
                    </svg>
                  </button>
                  <div id="conversation-reasoning-menu" class="conversation-setting-menu" role="listbox" aria-label="推理等级" hidden></div>
                </div>
              </div>
              <button id="conversation-submit" class="conversation-composer-control conversation-submit" type="submit" aria-label="发送" title="发送" disabled>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                  <path d="m22 2-7 20-4-9-9-4Z"></path>
                  <path d="M22 2 11 13"></path>
                </svg>
              </button>
            </div>
          </div>
        </form>

        <dialog id="conversation-create-dialog" class="codex-workspace-dialog conversation-create-dialog" aria-labelledby="conversation-create-title">
          <form id="conversation-create-form" class="codex-workspace-dialog-surface workspace-session-create-form" aria-labelledby="conversation-create-title">
            <div class="codex-workspace-dialog-header">
              <h3 id="conversation-create-title">新建 Session</h3>
              <button id="conversation-create-close" class="button-link codex-workspace-dialog-close" type="button" aria-label="关闭新建 Session 窗口">关闭</button>
            </div>
            <p class="workspace-session-create-description">选择工作目录后创建快速交互 Session。</p>
            <label class="workspace-session-create-field" for="conversation-create-workspaces">工作目录</label>
            <input id="conversation-create-workspaces" type="hidden">
            <div class="settings-choice-picker workspace-session-choice-picker">
              <button id="conversation-create-workspaces-trigger" class="settings-choice-picker-trigger" type="button" aria-haspopup="listbox" aria-controls="conversation-create-workspaces-menu" aria-expanded="false"><span id="conversation-create-workspaces-value"></span><span aria-hidden="true"></span></button>
              <div id="conversation-create-workspaces-menu" class="settings-choice-picker-menu" role="listbox" aria-label="工作目录" hidden></div>
            </div>
            <p id="conversation-create-message" class="message" aria-live="polite"></p>
            <div class="dialog-actions">
              <button id="conversation-create-cancel" class="button-link" type="button">取消</button>
              <button id="conversation-create-confirm" class="button-secondary" type="submit">创建</button>
            </div>
          </form>
        </dialog>

        <dialog id="conversation-rename-dialog" class="codex-workspace-dialog conversation-rename-dialog" aria-labelledby="conversation-rename-title">
          <form id="conversation-rename-form" class="codex-workspace-dialog-surface conversation-rename-form">
            <div class="codex-workspace-dialog-header">
              <h3 id="conversation-rename-title">重命名 Session</h3>
              <button id="conversation-rename-close" class="button-link codex-workspace-dialog-close" type="button" aria-label="关闭重命名窗口">关闭</button>
            </div>
            <label class="conversation-rename-field" for="conversation-rename-input">
              <span>Session 标题</span>
              <input id="conversation-rename-input" type="text" maxlength="48" required autocomplete="off">
            </label>
            <p id="conversation-rename-message" class="message" aria-live="polite"></p>
            <div class="dialog-actions">
              <button id="conversation-rename-cancel" class="button-link" type="button">取消</button>
              <button id="conversation-rename-confirm" class="button-secondary" type="submit">保存</button>
            </div>
          </form>
        </dialog>

        <dialog id="conversation-stop-dialog" class="codex-workspace-dialog confirmation-dialog conversation-stop-dialog" aria-labelledby="conversation-stop-title" aria-describedby="conversation-stop-description">
          <form id="conversation-stop-form" class="codex-workspace-dialog-surface confirmation-dialog-surface conversation-stop-form">
            <div class="codex-workspace-dialog-header">
              <h3 id="conversation-stop-title">停止 Session</h3>
              <button id="conversation-stop-close" class="button-link codex-workspace-dialog-close" type="button" aria-label="关闭停止确认">关闭</button>
            </div>
            <p id="conversation-stop-description" class="confirmation-dialog-description"></p>
            <div class="confirmation-dialog-actions">
              <button id="conversation-stop-cancel" class="button-link" type="button">取消</button>
              <button id="conversation-stop-confirm" class="button-danger" type="submit">确认停止</button>
            </div>
          </form>
        </dialog>

        <dialog id="conversation-archive-dialog" class="codex-workspace-dialog confirmation-dialog conversation-archive-dialog" aria-labelledby="conversation-archive-title" aria-describedby="conversation-archive-description">
          <form id="conversation-archive-form" class="codex-workspace-dialog-surface confirmation-dialog-surface conversation-archive-form">
            <div class="codex-workspace-dialog-header">
              <h3 id="conversation-archive-title">归档 Session</h3>
              <button id="conversation-archive-close" class="button-link codex-workspace-dialog-close" type="button" aria-label="关闭归档确认">关闭</button>
            </div>
            <p id="conversation-archive-description" class="confirmation-dialog-description"></p>
            <div class="confirmation-dialog-actions">
              <button id="conversation-archive-cancel" class="button-link" type="button">取消</button>
              <button id="conversation-archive-confirm" class="button-danger" type="submit">确认归档</button>
            </div>
          </form>
        </dialog>

        <dialog id="conversation-delete-dialog" class="codex-workspace-dialog confirmation-dialog conversation-delete-dialog" aria-labelledby="conversation-delete-title" aria-describedby="conversation-delete-description">
          <form id="conversation-delete-form" class="codex-workspace-dialog-surface confirmation-dialog-surface conversation-delete-form">
            <div class="codex-workspace-dialog-header">
              <h3 id="conversation-delete-title">删除 Session</h3>
              <button id="conversation-delete-close" class="button-link codex-workspace-dialog-close" type="button" aria-label="关闭删除确认">关闭</button>
            </div>
            <p id="conversation-delete-description" class="confirmation-dialog-description"></p>
            <div class="confirmation-dialog-actions">
              <button id="conversation-delete-cancel" class="button-link" type="button">取消</button>
              <button id="conversation-delete-confirm" class="button-danger" type="submit">确认删除</button>
            </div>
          </form>
        </dialog>
      </section>
    </main>
  </body>
</html>
