<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>快速交互 · 会话视图</title>
    {% include "partials/app_styles.html" %}
    <script src="/static/quick_interactions_core.js" defer></script>
    <script src="/static/quick_interaction_conversation.js" defer></script>
  </head>
  <body class="conversation-body" data-session-id="{{ session_id }}">
    <main>
      <section class="conversation-page" aria-label="快速交互会话视图">
        <div id="conversation-scroll" class="conversation-scroll">
          <button id="conversation-load-earlier" class="button-secondary conversation-load-earlier" type="button" hidden>加载更早消息</button>
          <p id="conversation-history-message" class="message conversation-history-message" aria-live="polite"></p>
          <div id="conversation-feed" class="conversation-feed" aria-label="快速交互消息"></div>
          <button id="conversation-jump-latest" class="button-secondary conversation-jump-latest" type="button" hidden>回到最新消息</button>
        </div>

        <form id="conversation-form" class="conversation-composer">
          <p id="conversation-submit-message" class="message" aria-live="polite"></p>
          <div class="conversation-input-row">
            <textarea id="conversation-prompt" rows="1" maxlength="8000" required placeholder="输入消息…" aria-label="快速交互需求" disabled></textarea>
            <button id="conversation-more" class="button-secondary conversation-more" type="button" aria-label="更多设置，当前执行方式为 Codex CLI" aria-expanded="false" aria-controls="conversation-more-panel" data-engine="codex_cli" disabled>＋</button>
            <button id="conversation-submit" type="submit" disabled hidden>发送</button>
          </div>
          <div id="conversation-more-panel" class="conversation-more-panel" aria-hidden="true" inert>
            <div class="conversation-more-panel-inner">
              <div class="conversation-more-setting">
                <div>
                  <strong>当前执行方式</strong>
                  <span>点击右侧按钮切换</span>
                </div>
                <button id="conversation-engine" class="button-secondary conversation-engine" type="button" disabled>Codex CLI</button>
              </div>
            </div>
          </div>
        </form>
      </section>
    </main>
  </body>
</html>
